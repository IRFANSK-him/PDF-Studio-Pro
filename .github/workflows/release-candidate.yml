name: Windows release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
      - name: Test
        run: python -m pytest tests -q
      - name: Build
        run: pyinstaller --noconfirm --clean --windowed --name PDF-Studio-Pro --paths src run.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "installer\\PDF-Studio-Pro.iss"'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Pro-Educational-Installer
          path: installer-output/*.exe
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Pro-Release-Candidate
          path: dist/PDF-Studio-Pro/
