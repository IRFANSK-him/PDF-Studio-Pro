name: Windows build
on:
  push:
    branches: [main, development/phase-1-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
      - name: Run engine tests
        run: python -m pytest tests -q
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --windowed --name PDF-Studio-Pro --paths src run.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Pro-Windows
          path: dist/PDF-Studio-Pro/
